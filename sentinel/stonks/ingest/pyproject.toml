[project]
name = "stonks-ingest"
version = "1.0.1"
requires-python = ">=3.12"
dependencies = [
  "stonks-core==1.0.0",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings[yaml]>=2.7,<3",
  "tzdata>=2025.2",
]

[tool.uv.sources]
stonks-core = { workspace = true }

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["stonks.ingest*"]
