[project]
name = "stonks-dividends"
version = "1.1.0"
requires-python = ">=3.12"
dependencies = [
  "sentinel-agents[dividends]==1.0.0",
  "sentinel-core==1.0.0",
  "stonks-core==1.0.0",
  "exchange-calendars>=4.13,<5",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings[yaml]>=2.7,<3",
  "pypdf>=5,<7",
  "tzdata>=2025.2",
]

[tool.uv.sources]
sentinel-agents = { workspace = true }
sentinel-core = { workspace = true }
stonks-core = { workspace = true }

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["stonks.dividends*"]
