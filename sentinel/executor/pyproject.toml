[project]
name = "sentinel-executor"
version = "1.0.3"
requires-python = ">=3.12"
dependencies = [
  "sentinel-core[kafka,github]==1.0.0",
  "httpx>=0.28,<1",
]

[tool.uv.sources]
sentinel-core = { workspace = true }

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["sentinel.executor*"]
