[project]
name = "sentinel-agents"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "sentinel-core==1.0.0",
  "langchain>=1.4,<2",
  "langchain-core>=1.6,<2",
  "langchain-openai>=1.7,<2",
]

[project.optional-dependencies]
sre = [
  "sentinel-core[knowledge-client]==1.0.0",
  "httpx>=0.28,<1",
]
dividends = [
  "httpx>=0.28,<1",
]

[tool.uv.sources]
sentinel-core = { workspace = true }

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["sentinel.agents*"]
