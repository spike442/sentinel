[project]
name = "sentinel-api"
version = "1.0.3"
requires-python = ">=3.12"
dependencies = [
  "sentinel-core[database,kafka,metrics]==1.0.0",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
]

[tool.uv.sources]
sentinel-core = { workspace = true }

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["sentinel.api*"]
