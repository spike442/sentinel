[project]
name = "sentinel-spark"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
  "boto3>=1.35,<2",
  "PyYAML>=6,<7",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["sentinel.spark*"]
