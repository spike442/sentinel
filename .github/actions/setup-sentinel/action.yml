name: Set up Sentinel
description: Install Python, uv, Helm for the chart-rendered test config, and the locked Sentinel workspace with dev tools
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      with:
        version: "0.12.20"
        python-version: "3.12"
        enable-cache: true
        cache-dependency-glob: sentinel/uv.lock
    - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      with:
        version: v4.3.1
    - name: Install workspace
      shell: bash
      working-directory: sentinel
      run: |
        uv sync --locked --all-packages --group dev
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
    - name: Render chart config
      shell: bash
      run: |
        directory="$RUNNER_TEMP/sentinel-config"
        mkdir -p "$directory"
        helm template sentinel infra/chart/sentinel --namespace agents \
          --values infra/chart/sentinel/ci/spark-values.yaml \
          --show-only templates/common/config.yaml \
          --show-only templates/spark/configmap.yaml \
          | yq ea -N '.data | to_entries | .[] | .key + "\t" + (.value | @base64)' \
          | while IFS=$'\t' read -r name content; do base64 -d <<< "$content" > "$directory/$name"; done
        echo "SENTINEL_CONFIG_DIR=$directory" >> "$GITHUB_ENV"
