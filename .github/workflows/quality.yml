name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

concurrency:
  group: sentinel-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sentinel:
    name: Sentinel quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sentinel/ui/package-lock.json
      - uses: ./.github/actions/setup-sentinel
      - name: Format
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version-file: sentinel/uv.lock
          src: sentinel
          args: format --check
      - name: Lint
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version-file: sentinel/uv.lock
          src: sentinel
      - name: Python checks
        if: ${{ !cancelled() }}
        working-directory: sentinel
        run: |
          pytest -q
          uv export --frozen --no-dev --all-packages --no-emit-workspace --format requirements-txt -o /tmp/requirements.txt
          uvx pip-audit==2.10.1 --strict --require-hashes -r /tmp/requirements.txt
      - name: UI checks
        if: ${{ !cancelled() }}
        working-directory: sentinel/ui
        run: |
          npm ci
          npm audit --audit-level=high
          npm run build

  images:
    if: github.event_name != 'pull_request'
    name: Image scan ${{ matrix.image }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image: [api, ui, workflow, sre, pr-review, executor, knowledge, spark]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          file: sentinel/${{ matrix.image }}/Dockerfile
          load: true
          tags: sentinel-${{ matrix.image }}:quality
          cache-from: type=gha,scope=sentinel-${{ matrix.image }}
      - name: Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: sentinel-${{ matrix.image }}:quality
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
      - name: Report
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: image-${{ matrix.image }}
