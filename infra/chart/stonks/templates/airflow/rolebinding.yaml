apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app.kubernetes.io/name: stonks-airflow
{{ include "stonks.standardLabels" . | indent 4 }}
  name: stonks-airflow
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: stonks-airflow
subjects:
- kind: ServiceAccount
  name: {{ .Values.airflow.serviceAccount }}
  namespace: {{ .Values.airflow.namespace }}
