apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  labels:
    app.kubernetes.io/name: stonks-api
{{ include "stonks.standardLabels" . | indent 4 }}
  name: stonks-api
  namespace: {{ .Release.Namespace }}
spec:
  hostnames:
  - {{ .Values.route.hostname | quote }}
  parentRefs:
  - name: {{ .Values.route.gatewayName }}
    namespace: {{ .Values.route.gatewayNamespace }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api/stonks
    backendRefs:
    - name: stonks-api
      port: 8090
