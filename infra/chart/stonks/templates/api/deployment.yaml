apiVersion: apps/v1
kind: Deployment
metadata:
  name: stonks-api
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: stonks-api
{{ include "stonks.standardLabels" . | indent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stonks-api
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/common/config.yaml") . | sha256sum }}
      labels:
        app.kubernetes.io/name: stonks-api
{{ include "stonks.standardLabels" . | indent 8 }}
    spec:
      serviceAccountName: stonks
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: stonks-api
        image: {{ .Values.images.api.repository }}:{{ .Values.images.api.tag | default .Chart.AppVersion }}
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8090
        readinessProbe:
          httpGet:
            path: /api/stonks/readyz
            port: http
        livenessProbe:
          httpGet:
            path: /api/stonks/healthz
            port: http
        env:
        - name: STONKS_CONFIG_DIR
          value: /etc/stonks
        - name: S3_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: stonks-secrets
              key: S3_ACCESS_KEY_ID
        - name: S3_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: stonks-secrets
              key: S3_SECRET_ACCESS_KEY
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        resources:
          requests:
            cpu: 10m
            memory: 96Mi
          limits:
            memory: 256Mi
        volumeMounts:
        - name: config
          mountPath: /etc/stonks
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: config
        configMap:
          name: stonks-config
      - name: tmp
        emptyDir: {}
