{{- if (index .Values.agents "pr-review").enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-pr-review
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "sentinel.standardLabels" . | indent 4 }}
    app.kubernetes.io/name: pr-review
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: pr-review}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/common/config.yaml") . | sha256sum }}
      labels:
{{ include "sentinel.standardLabels" . | indent 8 }}
        app.kubernetes.io/name: pr-review
        app.kubernetes.io/part-of: sentinel
    spec:
      serviceAccountName: pr-review
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ (index .Values.agents "pr-review").runTimeoutSeconds | int }}
      securityContext:
        runAsNonRoot: true
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: pr-review
        image: {{ .Values.images.prReview.repository }}:{{ .Values.images.prReview.tag | default .Chart.AppVersion }}
        imagePullPolicy: Always
        command: [python, -m, sentinel.agents.pr_review.worker]
        livenessProbe:
          exec:
            command:
            - python
            - -c
            - "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/sentinel-worker-heartbeat') > {{ (index .Values.agents "pr-review").runTimeoutSeconds | int }})"
          initialDelaySeconds: 60
          periodSeconds: 60
          failureThreshold: 3
        env:
        - {name: HOME, value: /home/sentinel}
        - {name: SENTINEL_KAFKA_USERNAME, value: {{ (index .Values.kafka.users "pr-review") | quote }}}
        - name: SENTINEL_KAFKA_PASSWORD
          valueFrom: {secretKeyRef: {name: {{ .Values.secrets.app }}, key: KAFKA_PR_REVIEW_PASSWORD}}
        - name: LLM_API_KEY
          valueFrom: {secretKeyRef: {name: {{ .Values.secrets.app }}, key: LLM_API_KEY}}
        - name: S3_ACCESS_KEY_ID
          valueFrom: {secretKeyRef: {name: {{ .Values.secrets.app }}, key: S3_ACCESS_KEY_ID}}
        - name: S3_SECRET_ACCESS_KEY
          valueFrom: {secretKeyRef: {name: {{ .Values.secrets.app }}, key: S3_SECRET_ACCESS_KEY}}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        resources:
          requests: {cpu: 50m, memory: 256Mi}
          limits: {memory: 768Mi}
        volumeMounts:
        - {name: config, mountPath: /etc/sentinel, readOnly: true}
        - {name: home, mountPath: /home/sentinel}
        - {name: tmp, mountPath: /tmp}
      volumes:
      - {name: config, configMap: {name: sentinel-config}}
      - {name: home, emptyDir: {}}
      - {name: tmp, emptyDir: {}}
{{- end }}
