{{- range $key, $topic := .Values.kafka.topics }}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: {{ $topic.name | replace "." "-" }}
  namespace: {{ $.Values.kafka.topicNamespace }}
  labels:
    app.kubernetes.io/name: sentinel
{{ include "sentinel.standardLabels" $ | indent 4 }}
    strimzi.io/cluster: {{ $.Values.kafka.cluster }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  topicName: {{ $topic.name }}
  partitions: {{ $topic.partitions | int }}
  replicas: {{ $.Values.kafka.topicReplicas | int }}
  config:
    cleanup.policy: delete
    retention.ms: {{ $.Values.kafka.topicRetentionMs | int64 }}
{{- end }}
