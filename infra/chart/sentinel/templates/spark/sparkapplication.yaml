{{- if .Values.spark.enabled }}
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: sentinel-streaming
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "sentinel.standardLabels" . | indent 4 }}
    app.kubernetes.io/name: sentinel-streaming
    app.kubernetes.io/part-of: sentinel
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  image: {{ .Values.images.spark.repository }}:{{ .Values.images.spark.tag | default .Chart.AppVersion }}
  imagePullPolicy: Always
  mainApplicationFile: local:///opt/sentinel-spark/main.py
  sparkVersion: "4.2.0"
  restartPolicy:
    type: Always
    onFailureRetryInterval: 30
    onSubmissionFailureRetryInterval: 30
  sparkConf:
    spark.sql.session.timeZone: UTC
    spark.sql.shuffle.partitions: "2"
  driver:
    cores: 1
    memory: 768m
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 185
      runAsGroup: 185
      fsGroup: 185
      seccompProfile: {type: RuntimeDefault}
    securityContext:
      allowPrivilegeEscalation: false
      capabilities: {drop: [ALL]}
    serviceAccount: sentinel-spark
    env:
    - name: HOME
      value: /tmp
    - name: SENTINEL_KAFKA_USERNAME
      value: {{ .Values.kafka.username | quote }}
    - name: SENTINEL_KAFKA_PASSWORD
      valueFrom:
        secretKeyRef:
          name: {{ .Values.secrets.app }}
          key: KAFKA_PASSWORD
    - name: S3_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: {{ .Values.secrets.app }}
          key: S3_ACCESS_KEY_ID
    - name: S3_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: {{ .Values.secrets.app }}
          key: S3_SECRET_ACCESS_KEY
    volumeMounts:
    - name: checkpoint
      mountPath: /data
    - name: tmp
      mountPath: /tmp
    - name: config
      mountPath: /etc/sentinel/spark.yml
      subPath: spark.yml
    - name: config
      mountPath: /etc/sentinel/logging.yaml
      subPath: logging.yaml
    - name: config
      mountPath: /etc/sentinel/s3.yaml
      subPath: s3.yaml
    resources:
      requests:
        cpu: 250m
        memory: 768Mi
      limits:
        cpu: "2"
        memory: 2Gi
  executor:
    instances: 1
    cores: 1
    memory: 768m
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 185
      runAsGroup: 185
      fsGroup: 185
      seccompProfile: {type: RuntimeDefault}
    securityContext:
      allowPrivilegeEscalation: false
      capabilities: {drop: [ALL]}
    env:
    - name: S3_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: {{ .Values.secrets.app }}
          key: S3_ACCESS_KEY_ID
    - name: S3_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: {{ .Values.secrets.app }}
          key: S3_SECRET_ACCESS_KEY
    volumeMounts:
    - name: tmp
      mountPath: /tmp
    - name: config
      mountPath: /etc/sentinel/spark.yml
      subPath: spark.yml
    - name: config
      mountPath: /etc/sentinel/logging.yaml
      subPath: logging.yaml
    - name: config
      mountPath: /etc/sentinel/s3.yaml
      subPath: s3.yaml
    resources:
      requests:
        cpu: 250m
        memory: 768Mi
      limits:
        cpu: "2"
        memory: 2Gi
  volumes:
  - name: checkpoint
    persistentVolumeClaim:
      claimName: sentinel-s3-archive
  - name: tmp
    emptyDir: {}
  - name: config
    configMap:
      name: sentinel-spark-config
{{- end }}
