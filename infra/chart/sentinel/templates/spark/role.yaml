{{- if .Values.spark.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/name: sentinel
{{ include "sentinel.standardLabels" . | indent 4 }}
  name: sentinel-spark-runtime
  namespace: {{ .Release.Namespace }}
rules:
- apiGroups: [""]
  resources:
  - pods
  - services
  - configmaps
  verbs: [get, list, watch, create, delete, patch]
{{- end }}
