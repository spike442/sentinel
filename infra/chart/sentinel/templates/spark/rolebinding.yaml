{{- if .Values.spark.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app.kubernetes.io/name: sentinel
{{ include "sentinel.standardLabels" . | indent 4 }}
  name: sentinel-spark-runtime
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sentinel-spark-runtime
subjects:
- kind: ServiceAccount
  name: sentinel-spark
  namespace: {{ .Release.Namespace }}
{{- end }}
