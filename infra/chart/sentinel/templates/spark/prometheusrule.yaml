{{- if .Values.spark.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/name: sentinel
{{ include "sentinel.standardLabels" . | indent 4 }}
  name: sentinel-spark-rules
  namespace: {{ .Release.Namespace }}
spec:
  groups:
  - name: sentinel.spark.rules
    rules:
    - alert: SentinelSparkDriverAbsent
      expr: absent(kube_pod_status_phase{namespace="{{ .Release.Namespace }}",pod=~"sentinel-streaming-.*",phase="Running"})
      for: 10m
      labels:
        severity: critical
      annotations:
        summary: Sentinel Spark streaming driver is not running
        description: No running Spark driver pod for sentinel-streaming has been observed for 10 minutes.
    - alert: SentinelSparkDriverRestarting
      expr: increase(kube_pod_container_status_restarts_total{namespace="{{ .Release.Namespace }}",pod=~"sentinel-streaming-.*"}[15m]) > 2
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: Sentinel Spark streaming driver is restarting
        description: The Sentinel Spark streaming driver restarted more than twice during the last 15 minutes.
{{- end }}
