{{- if .Values.spark.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app.kubernetes.io/name: sentinel
{{ include "sentinel.standardLabels" . | indent 4 }}
  namespace: {{ .Release.Namespace }}
  name: sentinel-s3-archive
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.spark.storageClass }}
  resources:
    requests:
      storage: 2Gi
{{- end }}
