{{- if .Values.spark.enabled }}
{{- $config := .Files.Get "config/spark.yml" | fromYaml }}
{{- $logging := .Files.Get "config/common/logging.yaml" | fromYaml }}
{{- $sharedKafka := .Files.Get "config/common/kafka.yaml" | fromYaml }}
{{- $commonKafka := index $sharedKafka "kafka" }}
{{- $kafka := dict "bootstrap_servers" .Values.kafka.bootstrapServers "security_protocol" (index $commonKafka "security_protocol") "sasl_mechanisms" (index $commonKafka "sasl_mechanisms") }}
{{- $streaming := index $config "streaming" }}
{{- $_ := set $config "kafka" $kafka }}
{{- $_ := set $streaming "topics" (list .Values.kafka.topics.outcomes.name) }}
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/name: sentinel
{{ include "sentinel.standardLabels" . | indent 4 }}
  name: sentinel-spark-config
  namespace: {{ .Release.Namespace }}
data:
  logging.yaml: |
{{ $logging | toYaml | indent 4 }}
  spark.yml: |
{{ $config | toYaml | indent 4 }}
  s3.yaml: |
{{ dict "s3" .Values.s3 | toYaml | indent 4 }}
{{- end }}
