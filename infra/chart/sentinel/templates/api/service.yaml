apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: sentinel
{{ include "sentinel.standardLabels" . | indent 4 }}
  name: sentinel-api
  namespace: {{ .Release.Namespace }}
spec:
